name: Nightly

on:
  # Sent by the QtAliceVision nightly once its archives are published
  repository_dispatch:
    types: [qtalicevision-nightly]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "macOS runner, e.g. macos-15-intel. Default: the runner of the AliceVision macOS nightly"
        type: string
        default: ""

permissions:
  contents: write  # needed to edit releases, upload/delete assets and update "nightly" tag

env:
  # Nightly binaries bundled into the Meshroom nightly
  ALICEVISION_REPO: ${{ vars.ALICEVISION_REPO || 'alicevision/AliceVision' }}
  QTALICEVISION_REPO: ${{ vars.QTALICEVISION_REPO || 'alicevision/QtAliceVision' }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Guard: skip everything if develop hasn't changed since the
  # SHA recorded in the single persistent "nightly" release.
  # ────────────────────────────────────────────────────────────
  check-changes:
    name: Check for new commits on develop
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_sha:    ${{ steps.check.outputs.short_sha }}
      full_sha:     ${{ steps.check.outputs.full_sha }}
      build_label:  ${{ steps.check.outputs.build_label }}
      av_linux_url:     ${{ steps.deps.outputs.av_linux_url }}
      av_windows_url:   ${{ steps.deps.outputs.av_windows_url }}
      qtav_linux_url:   ${{ steps.deps.outputs.qtav_linux_url }}
      qtav_windows_url: ${{ steps.deps.outputs.qtav_windows_url }}
      av_macos_url:     ${{ steps.deps.outputs.av_macos_url }}
      qtav_macos_url:   ${{ steps.deps.outputs.qtav_macos_url }}
      pyside6_version:  ${{ steps.deps.outputs.pyside6_version }}
      macos_runner:     ${{ inputs.macos_runner || steps.deps.outputs.macos_runner }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-tags: true  # required to find the previous nightly tag

      # The QtAliceVision plugins only load in the Qt they were built with:
      # read its version from the QtAliceVision release notes.
      - name: Resolve AliceVision and QtAliceVision nightlies
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nightlyAsset() {
            gh release view nightly --repo "$1" --json assets --jq ".assets[] | select(.name | endswith(\"$2\")) | .url"
          }
          AV_LINUX_URL=$(nightlyAsset "$ALICEVISION_REPO" linux.tar.gz)
          AV_WINDOWS_URL=$(nightlyAsset "$ALICEVISION_REPO" windows.zip)
          QTAV_LINUX_URL=$(nightlyAsset "$QTALICEVISION_REPO" linux.tar.gz)
          QTAV_WINDOWS_URL=$(nightlyAsset "$QTALICEVISION_REPO" windows.zip)
          # Optional: their macOS builds do not block their release, Meshroom is then built without AliceVision.
          # AliceVision also publishes its dependencies as -macos-deps.tar.gz, not matched here.
          AV_MACOS_URL=$(nightlyAsset "$ALICEVISION_REPO" macos.tar.gz)
          QTAV_MACOS_URL=$(nightlyAsset "$QTALICEVISION_REPO" macos.tar.gz)
          QTAV_NOTES=$(gh release view nightly --repo "$QTALICEVISION_REPO" --json body --jq '.body')
          # Reads the row of a QtAliceVision archive in its release notes:
          #   | `<archive>` | <platform> | <Qt version> | `<AliceVision archive>` |
          # Sets QT_VERSION, and warns if it is not built against the bundled AliceVision archive.
          checkQtAliceVision() {  # <QtAliceVision url> <AliceVision url>
            local row av
            QT_VERSION=""
            [ -n "$1" ] || return 0
            row=$(grep -F "$(basename "$1")" <<< "$QTAV_NOTES" || true)
            QT_VERSION=$(cut -d'|' -f4 <<< "$row" | tr -d ' \r')
            av=$(cut -d'|' -f5 <<< "$row" | tr -d ' `\r')
            [ "$av" = "$(basename "$2")" ] \
              || echo "::warning::$(basename "$1") is built against ${av:-an unknown archive}, not the bundled $(basename "$2")"
          }
          # PySide6 must have the Qt version of the plugins: the Linux one, checked on the other platforms
          checkQtAliceVision "$QTAV_LINUX_URL" "$AV_LINUX_URL"
          PYSIDE6_VERSION=$QT_VERSION
          checkQtAliceVision "$QTAV_WINDOWS_URL" "$AV_WINDOWS_URL"
          [ "$QT_VERSION" = "$PYSIDE6_VERSION" ] \
            || echo "::warning::QtAliceVision is built with Qt ${QT_VERSION:-unknown} on Windows, not ${PYSIDE6_VERSION} (PySide6)"
          if [ -n "$AV_MACOS_URL" ] && [ -n "$QTAV_MACOS_URL" ]; then
            checkQtAliceVision "$QTAV_MACOS_URL" "$AV_MACOS_URL"
            [ "$QT_VERSION" = "$PYSIDE6_VERSION" ] \
              || echo "::warning::QtAliceVision is built with Qt ${QT_VERSION:-unknown} on macOS, not ${PYSIDE6_VERSION} (PySide6)"
          fi
          # Build on the runner of the AliceVision macOS nightly (runs-on of its build-macos.yml at the archive's
          # commit, as QtAliceVision does), so that its binaries match the runner architecture.
          MACOS_RUNNER=macos-15
          if [ -n "$AV_MACOS_URL" ]; then
            AV_SHORT_SHA=$(basename "$AV_MACOS_URL" | sed -E 's/^AliceVision-nightly-[0-9]+-([0-9a-f]+)-macos\.tar\.gz$/\1/')
            RUNNER=$(gh api "repos/${ALICEVISION_REPO}/contents/.github/workflows/build-macos.yml?ref=$(gh api "repos/${ALICEVISION_REPO}/commits/${AV_SHORT_SHA}" --jq '.sha')" \
                     -H "Accept: application/vnd.github.raw" | sed -nE 's/^\s*runs-on:\s*(\S+)\s*$/\1/p' | head -n1) || true
            [ -n "$RUNNER" ] && MACOS_RUNNER=$RUNNER || echo "::warning::Runner of $(basename "$AV_MACOS_URL") not found, using $MACOS_RUNNER"
          fi
          for v in AV_LINUX_URL AV_WINDOWS_URL QTAV_LINUX_URL QTAV_WINDOWS_URL PYSIDE6_VERSION MACOS_RUNNER; do
            echo "$v=${!v}"
            test -n "${!v}"
            echo "${v,,}=${!v}" >> "$GITHUB_OUTPUT"
          done
          for v in AV_MACOS_URL QTAV_MACOS_URL; do
            echo "$v=${!v}"
            echo "${v,,}=${!v}" >> "$GITHUB_OUTPUT"
          done

      - name: Determine whether a build is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          BUILD_LABEL="$(date -u '+%Y.%m.%d')-${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA"   >> "$GITHUB_OUTPUT"
          echo "full_sha=$FULL_SHA"     >> "$GITHUB_OUTPUT"
          echo "build_label=$BUILD_LABEL" >> "$GITHUB_OUTPUT"

          # Read the SHA stored in the body of the persistent "nightly" release.
          # The body always contains a line of the form:  **Latest commit:** `<sha>`
          # LAST_SHA=$(
          #   gh release view nightly \
          #     --repo "$GITHUB_REPOSITORY" \
          #     --json body \
          #     --jq '.body' 2>/dev/null \
          #   | grep -oP '(?<=\*\*Latest commit:\*\* `)[\w]+' \
          #   || true
          # )
          # Read the SHA of the last "nightly" git tag
          LAST_SHA=$(git rev-parse --short nightly 2>/dev/null || true)

          # The release notes list the bundled AliceVision/QtAliceVision archives:
          # also rebuild when one of them has been updated.
          BODY=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)
          DEPS_CHANGED=false
          for ASSET in "$(basename "${{ steps.deps.outputs.av_linux_url }}")" "$(basename "${{ steps.deps.outputs.qtav_linux_url }}")"; do
            grep -qF "$ASSET" <<< "$BODY" || DEPS_CHANGED=true
          done

          if [ "$SHORT_SHA" = "$LAST_SHA" ] && [ "$DEPS_CHANGED" = false ]; then
            echo "develop and bundled nightlies unchanged since last nightly (SHA: $SHORT_SHA). Skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected (current: $SHORT_SHA, last nightly: ${LAST_SHA:-none}). Building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows binary
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: windows-latest
      build_label: ${{ needs.check-changes.outputs.build_label }}
      alicevision_url: ${{ needs.check-changes.outputs.av_windows_url }}
      qtalicevision_url: ${{ needs.check-changes.outputs.qtav_windows_url }}
      pyside6_version: ${{ needs.check-changes.outputs.pyside6_version }}

  build-linux:
    name: Build Linux binary
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: ubuntu-22.04
      build_label: ${{ needs.check-changes.outputs.build_label }}
      alicevision_url: ${{ needs.check-changes.outputs.av_linux_url }}
      qtalicevision_url: ${{ needs.check-changes.outputs.qtav_linux_url }}
      pyside6_version: ${{ needs.check-changes.outputs.pyside6_version }}

  build-macos:
    name: Build macOS binary
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: ${{ needs.check-changes.outputs.macos_runner }}
      build_label: ${{ needs.check-changes.outputs.build_label }}
      alicevision_url: ${{ needs.check-changes.outputs.av_macos_url }}
      qtalicevision_url: ${{ needs.check-changes.outputs.qtav_macos_url }}
      pyside6_version: ${{ needs.check-changes.outputs.pyside6_version }}

  # ────────────────────────────────────────────────────────────
  # Update the single persistent "nightly" pre-release:
  #   - delete old assets
  #   - upload new assets
  #   - prepend a build entry to the release body
  #   - prune body entries older than 3 days
  # ────────────────────────────────────────────────────────────
  # The macOS build does not block the release: the hosted macOS arm64 runners
  # are often saturated, and its job then fails without having started.
  release:
    name: Update nightly release
    needs: [check-changes, build-windows, build-linux, build-macos]
    if: >-
      !cancelled() && needs.check-changes.outputs.should_build == 'true' &&
      needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write  # to push git tag nightly

    env:
      SHORT_SHA:   ${{ needs.check-changes.outputs.short_sha }}
      FULL_SHA:    ${{ needs.check-changes.outputs.full_sha }}
      BUILD_LABEL: ${{ needs.check-changes.outputs.build_label }}
      GH_TOKEN:    ${{ github.token }}
      AV_ASSET:    ${{ needs.check-changes.outputs.av_linux_url }}
      QTAV_ASSET:  ${{ needs.check-changes.outputs.qtav_linux_url }}
      MACOS_WITH_AV: ${{ needs.build-macos.outputs.alicevision_bundled }}
      MACOS_RUNNER: ${{ needs.check-changes.outputs.macos_runner }}
      MACOS_DMG:   dist/binary-macos/Meshroom-${{ needs.check-changes.outputs.build_label }}-macos.dmg
      PYSIDE6_VERSION: ${{ needs.check-changes.outputs.pyside6_version }}

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      # ── Create the release if it doesn't exist yet ──────────
      - name: Ensure "nightly" release exists
        run: |
          if ! gh release view nightly --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Creating initial nightly release…"
            gh release create nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nightly build (develop)" \
              --notes "_(first build — history will appear here)_" \
              --prerelease
          fi

      # ── Replace assets ───────────────────────────────────────
      # Delete every existing asset on the release, then upload the fresh ones.
      # This keeps the release page clean: one asset per platform.
      - name: Delete existing assets
        run: |
          gh release view nightly \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' \
          | while read -r ASSET; do
              echo "  → Deleting asset: $ASSET"
              gh release delete-asset nightly "$ASSET" \
                --repo "$GITHUB_REPOSITORY" --yes
            done

      - name: Upload new assets
        run: |
          find dist/ -type f -ls
          ASSETS=("dist/binary-windows/Meshroom-${BUILD_LABEL}-windows.zip" "dist/binary-linux/Meshroom-${BUILD_LABEL}-linux.tar.gz")
          [ ! -f "$MACOS_DMG" ] || ASSETS+=("$MACOS_DMG")
          gh release upload nightly --repo "$GITHUB_REPOSITORY" "${ASSETS[@]}"

      # ── Update release body ──────────────────────────────────
      # Rewrite the release body with the latest build info.
      - name: Update release notes
        run: |
          NOW=$(date -u '+%Y-%m-%d %H:%M UTC')
          MACOS_NOTE="built on ${MACOS_RUNNER}, unsigned: \`xattr -dr com.apple.quarantine /Applications/Meshroom.app\` before the first launch"
          # Not bundled without both macOS nightlies, or when they do not match the runner architecture
          [ "$MACOS_WITH_AV" = true ] || MACOS_NOTE="${MACOS_NOTE}. **Without AliceVision**: no AliceVision and QtAliceVision macOS nightlies for this architecture"
          MACOS_ROW="| **macOS** | \`$(basename "$MACOS_DMG")\` (${MACOS_NOTE}) |"
          [ -f "$MACOS_DMG" ] || MACOS_ROW="| **macOS** | Not built this time: no macOS runner available, or build failure |"
 
          cat > nightly_release_notes.md << EOF
          > [!WARNING]
          > **Automated nightly build** from the \`develop\` branch. May be unstable.
 
          | | |
          |---|---|
          | Date   | ${NOW} |
          | Commit | [${SHORT_SHA}](https://github.com/${{ github.repository }}/commit/${FULL_SHA}) |
          | **Windows** | \`Meshroom-${BUILD_LABEL}-windows.zip\` |
          | **Linux** | \`Meshroom-${BUILD_LABEL}-linux.tar.gz\` (Rocky 9, glibc >= 2.34) |
          ${MACOS_ROW}
          | AliceVision | [\`$(basename "$AV_ASSET")\`](https://github.com/${ALICEVISION_REPO}/releases/tag/nightly) |
          | QtAliceVision | [\`$(basename "$QTAV_ASSET")\`](https://github.com/${QTALICEVISION_REPO}/releases/tag/nightly) |
          | PySide6 | ${PYSIDE6_VERSION} |
          EOF
 
          gh release edit nightly \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file nightly_release_notes.md

      # ── Move the nightly tag to current HEAD ──────
      - name: Re-tag nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Force-update the nightly tag to the built develop commit via the GitHub API.
          # This avoids needing git remote auth or being inside a git directory.
          gh api --method PATCH "/repos/${{ github.repository }}/git/refs/tags/nightly" -f sha="${FULL_SHA}" -F force=true || \
          gh api --method POST "/repos/${{ github.repository }}/git/refs" -f ref="refs/tags/nightly" -f sha="${FULL_SHA}"
