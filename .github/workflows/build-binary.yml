# .github/workflows/build-binary.yml
# Reusable workflow – called by continuous-integration.yml and nightly.yml

name: Build binary

on:
  workflow_call:
    inputs:
      build_label:
        description: "Label appended to the output folder name, e.g. '20240101-abc1234'"
        type: string
        required: true
      os:
        description: "Runner OS: 'ubuntu-22.04', 'windows-latest' or 'macos-latest'"
        type: string
        required: true
      alicevision_url:
        description: "AliceVision nightly archive bundled in aliceVision/, nothing is bundled if empty"
        type: string
        default: ''
      qtalicevision_url:
        description: "QtAliceVision nightly archive bundled in qtPlugins/, nothing is bundled if empty"
        type: string
        default: ''
      pyside6_version:
        description: "PySide6 version, must match the Qt version QtAliceVision is built with"
        type: string
        required: true
    outputs:
      artifact_name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    runs-on: ${{ inputs.os }}
    # Build on Linux in the same distribution as the AliceVision/QtAliceVision nightlies (Rocky 9),
    # so that the bundle does not require a more recent glibc than they do.
    container: ${{ startsWith(inputs.os, 'ubuntu') && 'rockylinux:9' || '' }}

    outputs:
      artifact_name: ${{ steps.set-names.outputs.artifact_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11 (Windows and macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compute platform names
        id: set-names
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "platform=windows"          >> "$GITHUB_OUTPUT"
            echo "output_dir=Meshroom-${{ inputs.build_label }}-windows"   >> "$GITHUB_OUTPUT"
            echo "archive=Meshroom-${{ inputs.build_label }}-windows.zip"  >> "$GITHUB_OUTPUT"
            echo "artifact_name=binary-windows"                            >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "platform=macos"            >> "$GITHUB_OUTPUT"
            echo "output_dir=Meshroom-${{ inputs.build_label }}-macos"     >> "$GITHUB_OUTPUT"
            echo "archive=Meshroom-${{ inputs.build_label }}-macos.tar.gz" >> "$GITHUB_OUTPUT"
            echo "artifact_name=binary-macos"                              >> "$GITHUB_OUTPUT"
          else
            echo "platform=linux"            >> "$GITHUB_OUTPUT"
            echo "output_dir=Meshroom-${{ inputs.build_label }}-linux"     >> "$GITHUB_OUTPUT"
            echo "archive=Meshroom-${{ inputs.build_label }}-linux.tar.gz" >> "$GITHUB_OUTPUT"
            echo "artifact_name=binary-linux"                              >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          dnf install -y \
            python3.11 python3.11-pip binutils findutils tar gzip zstd \
            mesa-libGL mesa-libEGL glib2 dbus-libs fontconfig freetype \
            libxkbcommon libxkbcommon-x11 libX11 libX11-xcb libxcb
          dnf clean all
          python3.11 -m venv /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev_requirements.txt
          pip install "PySide6==${{ inputs.pyside6_version }}"

      - name: Build executable
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          python setup.py install_exe -d "$OUTPUT_DIR"

      - name: Remove unused PySide6 files (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          cd "%OUTPUT_DIR%\lib\PySide6"
          del /s /q Qt6Web*.dll Qt6Designer*.dll *.exe
          if exist resources    rmdir /s /q resources
          if exist translations rmdir /s /q translations
          if exist typesystems  rmdir /s /q typesystems
          if exist examples     rmdir /s /q examples
          if exist include      rmdir /s /q include

      - name: Remove unused PySide6 files (Linux and macOS)
        if: runner.os != 'Windows'
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          cd "${OUTPUT_DIR}/lib/PySide6"
          rm -rf resources translations typesystems examples include
          cd Qt/lib
          # libQt6<Module>*.so* on Linux, Qt<Module>*.framework on macOS
          for MODULE in WebEngine Designer Multimedia SpatialAudio DataVisualization Graphs Bluetooth Nfc \
                        SerialPort SerialBus Sensors TextToSpeech VirtualKeyboard WebSockets WebChannel \
                        RemoteObjects Scxml StateMachine NetworkAuth; do
            rm -rf *Qt6${MODULE}*.so* Qt${MODULE}*.framework
          done

      # No macOS machine at hand: at least check that the frozen executables start.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
        run: |
          "$OUTPUT_DIR/meshroom_compute" -h
          "$OUTPUT_DIR/meshroom_info" -h

      # Image matching in the default pipelines needs the vocabulary tree, not shipped by AliceVision.
      - name: Cache vocabulary tree
        if: inputs.alicevision_url != ''
        id: cache-voctree
        uses: actions/cache@v4
        with:
          path: voctree
          key: voctree-vlfeat_K80L3.SIFT

      - name: Download vocabulary tree
        if: inputs.alicevision_url != '' && steps.cache-voctree.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p voctree
          curl -fsSL --retry 5 -o voctree/vlfeat_K80L3.SIFT.tree \
            https://gitlab.com/alicevision/trainedVocabularyTreeData/raw/master/vlfeat_K80L3.SIFT.tree

      # Layout expected by meshroom.setupEnvironment: aliceVision/{bin,lib*,share} and qtPlugins/{qml,imageformats}.
      - name: Bundle AliceVision and QtAliceVision
        if: inputs.alicevision_url != '' && inputs.qtalicevision_url != ''
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
          AV_URL:     ${{ inputs.alicevision_url }}
          QTAV_URL:   ${{ inputs.qtalicevision_url }}
        run: |
          set -euo pipefail
          mkdir -p downloads/qtav "$OUTPUT_DIR/aliceVision" "$OUTPUT_DIR/qtPlugins"
          curl -fsSL --retry 5 -o "downloads/av" "$AV_URL"
          curl -fsSL --retry 5 -o "downloads/qtav.archive" "$QTAV_URL"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The AliceVision zip has no top-level folder, the QtAliceVision one has QTAV_install/
            7z x -bd -y downloads/av -o"$OUTPUT_DIR/aliceVision" > /dev/null
            7z x -bd -y downloads/qtav.archive -o"downloads/qtav" > /dev/null
            cp -r downloads/qtav/*/. "$OUTPUT_DIR/qtPlugins/"
          else
            tar -xzf downloads/av -C "$OUTPUT_DIR/aliceVision" --strip-components=1
            tar -xzf downloads/qtav.archive -C "$OUTPUT_DIR/qtPlugins" --strip-components=1
          fi
          cp voctree/vlfeat_K80L3.SIFT.tree "$OUTPUT_DIR/aliceVision/share/aliceVision/"
          # Headers, import libraries and CMake configs are only needed to build against AliceVision
          rm -rf "$OUTPUT_DIR/aliceVision/include" "$OUTPUT_DIR/aliceVision/share/aliceVision/cmake" "$OUTPUT_DIR/qtPlugins/include"
          find "$OUTPUT_DIR/aliceVision" "$OUTPUT_DIR/qtPlugins" -name "*.lib" -delete
          test -f "$OUTPUT_DIR/aliceVision/share/aliceVision/cameraSensors.db"
          test -f "$OUTPUT_DIR/aliceVision/share/meshroom/photogrammetry.mg"
          test -f "$OUTPUT_DIR/qtPlugins/qml/AliceVision/qmldir"
          ls "$OUTPUT_DIR" "$OUTPUT_DIR/aliceVision" "$OUTPUT_DIR/qtPlugins"

      - name: Create archive (Windows)
        if: github.workflow == 'Nightly' && runner.os == 'Windows'
        shell: pwsh
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
          ARCHIVE:    ${{ steps.set-names.outputs.archive }}
        run: Compress-Archive -Path "$env:OUTPUT_DIR" -DestinationPath "$env:ARCHIVE"

      # tar rather than zip: keeps the symlinks of the macOS frameworks
      - name: Create archive (Linux and macOS)
        if: github.workflow == 'Nightly' && runner.os != 'Windows'
        env:
          OUTPUT_DIR: ${{ steps.set-names.outputs.output_dir }}
          ARCHIVE:    ${{ steps.set-names.outputs.archive }}
        run: tar -czf "$ARCHIVE" "$OUTPUT_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: github.workflow == 'Nightly'
        with:
          name: ${{ steps.set-names.outputs.artifact_name }}
          path: ${{ steps.set-names.outputs.archive }}
          retention-days: 1

